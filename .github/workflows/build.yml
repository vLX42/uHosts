name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          uname -m

      - name: Build .app bundle
        run: ./build.sh

      - name: Verify binary
        run: |
          file build/uHosts.app/Contents/MacOS/uHosts
          du -sh build/uHosts.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uHosts-${{ github.sha }}
          path: build/uHosts.app
          if-no-files-found: error
          retention-days: 14
